<!-- templates/fund/edit.html -->
{% extends "base.html" %}
{% block title %}编辑资金记录{% endblock %}

{% block content %}
<style>
    :root {
        --success-color: #198754;
        --primary-color: #0d6efd;
        --danger-color: #dc3545;
        --warning-color: #ffc107;
        --border-radius: 8px;
        --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .card {
        border: none;
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
        max-width: 900px;
        margin: 0 auto;
    }

    .card-header {
        background: linear-gradient(135deg, var(--warning-color) 0%, #e0a800 100%) !important;
        padding: 1rem 1.5rem;
        border-bottom: none;
    }

    .card-body {
        padding: 2rem;
    }

    h5.mb-3 {
        font-weight: 600;
        color: var(--warning-color);
        padding-bottom: 0.5rem;
        border-bottom: 2px solid rgba(255, 193, 7, 0.1);
        margin-bottom: 1.5rem !important;
        display: flex;
        align-items: center;
    }

    h5.mb-3 i {
        margin-right: 0.5rem;
    }

    .btn-warning {
        border-radius: var(--border-radius);
        padding: 0.75rem 1.5rem;
        font-weight: 500;
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px rgba(255, 193, 7, 0.15);
    }

    .btn-warning:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 10px rgba(255, 193, 7, 0.2);
    }

    .btn-link {
        color: #6c757d;
        transition: all 0.2s ease;
        border-radius: var(--border-radius);
        padding: 0.75rem 1.5rem;
    }

    .btn-link:hover {
        color: #212529;
        background-color: #f8f9fa;
        text-decoration: none;
    }

    .form-control:focus {
        border-color: var(--warning-color);
        box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.1);
    }

    .original-info {
        background-color: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: var(--border-radius);
        padding: 1rem;
        margin-bottom: 1.5rem;
    }

    .original-info small {
        color: #856404;
    }
</style>

<div class="container mt-4 mb-5">
    <div class="card shadow border-0">
        <div class="card-header bg-warning text-dark py-3">
            <h4 class="mb-0"><i class="bi bi-pencil-square"></i> 编辑财务记录</h4>
        </div>
        <div class="card-body p-4">
            <!-- 原始信息提示 -->
            <div class="original-info">
                <small><i class="bi bi-info-circle me-1"></i> 正在编辑记录 ID: {{ record.id }}，修改后余额将自动重新计算</small>
            </div>

            <form action="{{ url_for('fund.fund_edit', record_id=record.id) }}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                <div class="mb-4">
                    <h5 class="mb-3 text-warning border-bottom pb-2">
                        <i class="bi bi-receipt"></i> 收支详情
                    </h5>
                    {% include 'fund/_partial_fund_form.html' %}
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-warning btn-lg shadow">
                        <i class="bi bi-save"></i> 保存修改
                    </button>
                    <a href="{{ url_for('fund.fund_list') }}" class="btn btn-link text-muted">取消返回</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% block scripts %}
<script>
$(document).ready(function() {
    // 金额输入框样式动态切换（覆盖 partial 中的样式，与编辑场景的金额正负判断保持一致）
    $('#finance_amount').on('input', function() {
        const val = parseFloat($(this).val());
        const group = $(this).prev('.input-group-text');

        if (isNaN(val)) return;

        if (val >= 0) {
            group.removeClass('bg-danger').addClass('bg-success');
            $(this).removeClass('border-danger').addClass('border-success');
        } else {
            group.removeClass('bg-success').addClass('bg-danger');
            $(this).removeClass('border-success').addClass('border-danger');
        }
    });
});
</script>
{% endblock %}
{% endblock %}
